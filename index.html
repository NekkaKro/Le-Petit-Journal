<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Le Petit Journal</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --accent: #d4af37;
            --font-family: "Georgia", serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            margin: 0;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }
        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #333;
            padding-bottom: 16px;
        }
        h1 {
            font-size: 1.8rem;
            margin: 0 0 8px 0;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 10px 14px;
            border-radius: 8px;
        }
        button {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 8px 14px;
            border-radius: 4px;
            font-family: var(--font-family);
            cursor: pointer;
        }
        button:active {
            background: var(--accent);
            color: #000;
        }
        #status {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            margin: 40px 0;
        }
        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .article-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 8px;
            border-left: 3px solid var(--accent);
        }
        .article-title {
            font-size: 1.1rem;
            margin: 0 0 8px 0;
            color: #fff;
            text-decoration: none;
            display: block;
        }
        .article-title:hover {
            color: var(--accent);
        }
        .article-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>Le Petit Journal</h1>
        <div class="subtitle">Dark Academia Reader</div>
    </header>

    <div class="controls">
        <span id="source-count">Lade Feeds...</span>
        <button onclick="loadAllFeeds()">Actualiser</button>
    </div>

    <div id="status">Bereit zum Laden.</div>
    <div id="articles" class="feed-container"></div>

    <script>
        // Deine RSS-Quellen hier eintragen
        const SOURCES = [
            { name: "Le Monde", url: "https://www.lemonde.fr/rss/une.xml" },
            { name: "Tagesschau", url: "https://www.tagesschau.de/xml/rss2" }
        ];

        // Wir nutzen einen extrem stabilen öffentlichen Fallback-Proxy, der CORS umgeht
        const PROXY = "https://api.allorigins.win/raw?url=";

        async function loadAllFeeds() {
            const statusEl = document.getElementById("status");
            const container = document.getElementById("articles");
            const countEl = document.getElementById("source-count");
            
            statusEl.textContent = "Wird geladen ...";
            container.innerHTML = "";
            
            let allArticles = [];

            for (let i = 0; i < SOURCES.length; i++) {
                const source = SOURCES[i];
                countEl.textContent = `Lade ${i + 1} von ${SOURCES.length}...`;

                try {
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), 6000); // Harter Stopp nach 6 Sek. pro Feed

                    const response = await fetch(PROXY + encodeURIComponent(source.url), {
                        signal: controller.signal,
                        cache: "no-store"
                    });
                    
                    clearTimeout(timer);

                    if (!response.ok) throw new Error("HTTP " + response.status);
                    
                    const text = await response.text();
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(text, "text/xml");
                    
                    const items = xml.querySelectorAll("item");
                    items.forEach(item => {
                        const title = item.querySelector("title")?.textContent || "Kein Titel";
                        const link = item.querySelector("link")?.textContent || "#";
                        const pubDate = item.querySelector("pubDate")?.textContent || "";
                        
                        allArticles.push({
                            title: title,
                            link: link,
                            source: source.name,
                            date: new Date(pubDate).toLocaleDateString()
                        });
                    });

                } catch (e) {
                    console.warn(`Überspringe ${source.name} wegen Fehler:`, e.message);
                }
            }

            if (allArticles.length === 0) {
                statusEl.textContent = "Feeds zur Zeit nicht erreichbar.";
                countEl.textContent = "0 Quellen aktiv";
                return;
            }

            statusEl.textContent = "";
            countEl.textContent = `${allArticles.length} Beiträge geladen`;

            // Nach Datum sortieren (neueste zuerst, falls Datum lesbar)
            allArticles.sort((a, b) => new Date(b.date) - new Date(a.date));

            // Auf dem Bildschirm anzeigen
            allArticles.forEach(art => {
                const card = document.createElement("div");
                card.className = "article-card";
                card.innerHTML = `
                    <a href="${art.link}" target="_blank" class="article-title">${art.title}</a>
                    <div class="article-meta">${art.source} &bull; ${art.date !== "Invalid Date" ? art.date : ""}</div>
                `;
                container.appendChild(card);
            });
        }

        // Beim Start direkt einmal ausführen
        loadAllFeeds();
    </script>
</body>
</html>
